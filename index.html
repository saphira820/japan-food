<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FAF6EC">
<title>日本美食速查</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Noto+Serif+TC:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EC;
    --paper-deep:#F1E7D3;
    --paper-card:#FFFDF8;
    --ink:#232F3B;
    --ink-soft:#66727C;
    --accent:#B94A28;
    --accent-soft:#E7C9AE;
    --matcha:#5C7A52;
    --gold:#C79A2E;
    --line:#DCD0B6;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html{
    scroll-behavior:smooth;
    background:var(--paper);
  }
  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto;} *{animation:none!important;transition:none!important;} }

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Serif TC', serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:80px;
  }

  /* ---------- Header ---------- */
  .hero{
    position:relative;
    padding:28px 20px 18px;
    text-align:center;
    background:
      linear-gradient(var(--paper), var(--paper));
    border-bottom:1px solid var(--line);
  }
  .hero .eyebrow{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:11px;
    letter-spacing:.28em;
    color:var(--accent);
    text-transform:uppercase;
  }
  .hero h1{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:clamp(26px,6vw,36px);
    margin:6px 0 4px;
    letter-spacing:.04em;
  }
  .hero p{
    margin:0;
    font-size:13px;
    color:var(--ink-soft);
    font-family:'Zen Kaku Gothic New', sans-serif;
  }
  .io-icons{
    position:absolute;
    top:12px; right:12px;
    display:flex;
    gap:6px;
  }
  .io-icons button{
    width:32px; height:32px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--paper-card);
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .io-icons button:hover{ color:var(--accent); border-color:var(--accent-soft); }
  .io-icons button svg{ width:15px; height:15px; display:block; }
  .io-icons button.cloud-active{ color:var(--matcha); border-color:var(--matcha); }
  .updated-at{
    position:absolute;
    top:48px; right:14px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:10px;
    color:var(--ink-soft);
    white-space:nowrap;
  }

  /* ---------- Sticky nav ---------- */
  .navbar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--ink);
    border-bottom:3px solid var(--gold);
  }
  .nav-scroll{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:4px 6px;
  }
  .navpill{
    flex:0 0 auto;
    position:relative;
    padding:10px 12px 9px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13px;
    font-weight:500;
    color:#C9CFD4;
    background:none;
    border:none;
    cursor:pointer;
    white-space:nowrap;
    letter-spacing:.02em;
  }
  .navpill::after{
    content:"";
    position:absolute;
    left:10px; right:10px; bottom:2px;
    height:3px;
    background:var(--accent);
    transform:scaleX(0);
    transform-origin:center;
    transition:transform .2s ease;
  }
  .navpill.active{ color:#FDF9F0; }
  .navpill.active::after{ transform:scaleX(1); }

  /* ---------- Search ---------- */
  .search-wrap{
    max-width:640px;
    margin:20px auto 6px;
    padding:0 20px;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:11px 14px;
    box-shadow:0 1px 0 var(--line);
  }
  .search-box svg{ flex:0 0 auto; opacity:.55; }
  .search-box input{
    flex:1;
    border:none;
    outline:none;
    background:none;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  .search-box input::placeholder{ color:#A6A091; }
  .search-hint{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:11px;
    color:var(--ink-soft);
    padding:6px 4px 0;
  }

  /* ---------- Sections ---------- */
  .container{ max-width:640px; margin:0 auto; padding:10px 20px 0; }

  section.category{ padding-top:34px; scroll-margin-top:56px; }
  .cat-head{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:14px;
  }
  .seal{
    flex:0 0 auto;
    width:46px; height:46px;
    border-radius:50%;
    border:2px solid var(--accent);
    box-shadow:0 0 0 1px var(--paper), 0 0 0 3px var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
    color:var(--accent);
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:20px;
    transform:rotate(var(--tilt,-4deg));
  }
  .cat-titles h2{
    margin:0;
    font-family:'Shippori Mincho', serif;
    font-size:21px;
    font-weight:600;
    letter-spacing:.03em;
  }
  .cat-titles .count{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:11px;
    color:var(--ink-soft);
  }
  .rule{
    height:1px;
    background:linear-gradient(to right, var(--gold), var(--line) 40%);
    margin-bottom:16px;
  }

  .cards{ display:flex; flex-direction:column; gap:6px; }
  .card{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:4px;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-left:3px solid var(--matcha);
    border-radius:var(--radius);
    padding:9px 78px 9px 10px;
  }
  .card.dragging{ opacity:.55; border-style:dashed; }

  .card .ctrl-top{
    position:absolute;
    top:5px; right:4px;
    display:flex;
    align-items:center;
    gap:2px;
  }
  .card .link-open{
    flex:0 0 auto;
    border:none;
    background:none;
    color:var(--matcha);
    padding:4px;
    cursor:pointer;
    line-height:0;
  }
  .card .link-open:hover{ color:var(--accent); }
  .card .link-open svg{ width:14px; height:14px; display:block; }

  .link-menu{
    position:absolute;
    top:34px; right:4px;
    z-index:30;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow:0 4px 14px rgba(35,47,59,.15);
    padding:4px;
    display:flex;
    flex-direction:column;
    min-width:140px;
    max-width:220px;
  }
  .link-menu button{
    text-align:left;
    border:none;
    background:none;
    padding:8px 10px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12.5px;
    color:var(--ink);
    cursor:pointer;
    border-radius:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .link-menu button:hover{ background:var(--paper-deep); }

  .card .row1{
    display:flex;
    align-items:center;
    gap:7px;
  }
  .card .handle{
    flex:0 0 auto;
    cursor:grab;
    color:#B9AFA0;
    font-size:14px;
    line-height:1;
    padding:4px 2px;
    touch-action:none;
    user-select:none;
  }
  .card .handle:active{ cursor:grabbing; }
  .card .speak{
    flex:0 0 auto;
    border:none;
    background:none;
    padding:4px;
    line-height:0;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .card .speak:hover{ color:var(--accent); }
  .card .speak svg{ width:16px; height:16px; display:block; }
  .card .speak.speaking{ color:var(--accent); }
  .card .jp{
    font-family:'Shippori Mincho', serif;
    font-size:15px;
    font-weight:600;
    white-space:normal;
    overflow-wrap:break-word;
    flex:1 1 auto;
    min-width:0;
    cursor:pointer;
    transition:color .15s ease;
  }
  .card .jp.copied{ color:var(--accent); }

  .card .row2{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
    margin-left:47px;
  }
  .card .zh{
    font-family:'Noto Serif TC', serif;
    font-size:12.5px;
    color:#4B5560;
    white-space:normal;
    overflow-wrap:break-word;
    flex:1 1 auto;
    min-width:0;
  }
  .card .src{
    flex:0 0 auto;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:10px;
    letter-spacing:.02em;
    color:var(--ink-soft);
    background:var(--paper-deep);
    padding:2px 8px;
    border-radius:20px;
    cursor:pointer;
    user-select:none;
  }
  .card .src.expanded{ background:var(--accent-soft); color:var(--ink); }

  .card .edit{
    flex:0 0 auto;
    border:none;
    background:none;
    color:var(--ink-soft);
    padding:4px;
    cursor:pointer;
    line-height:0;
  }
  .card .edit:hover{ color:var(--matcha); }
  .card .edit svg{ width:14px; height:14px; display:block; }

  .card .del{
    flex:0 0 auto;
    border:none;
    background:none;
    color:#B9AFA0;
    font-size:15px;
    cursor:pointer;
    line-height:1;
    padding:4px;
  }
  .card .del:hover{ color:var(--accent); }

  .empty{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    padding:14px 2px;
    border:1px dashed var(--line);
    border-radius:var(--radius);
    text-align:center;
  }

  /* ---------- Add form ---------- */
  .add-toggle{
    margin-top:10px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12.5px;
    color:var(--accent);
    background:none;
    border:1px dashed var(--accent-soft);
    border-radius:var(--radius);
    padding:8px 12px;
    cursor:pointer;
    width:100%;
    text-align:left;
  }
  .add-form{
    display:none;
    margin-top:10px;
    background:var(--paper-deep);
    border-radius:var(--radius);
    padding:12px;
  }
  .add-form.open{ display:block; }
  .edit-form{ margin-top:0 !important; }
  .add-form .row{ display:flex; gap:8px; margin-bottom:8px; }
  .add-form input{
    flex:1;
    min-width:0;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--paper-card);
    outline:none;
  }
  .add-form input:focus{ border-color:var(--accent); }
  .add-form .actions{ display:flex; justify-content:flex-end; gap:8px; }
  .add-form button.submit{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12.5px;
    background:var(--accent);
    color:#FFF6EE;
    border:none;
    border-radius:4px;
    padding:8px 16px;
    cursor:pointer;
  }
  .add-form button.cancel{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12.5px;
    background:none;
    color:var(--ink-soft);
    border:none;
    cursor:pointer;
    padding:8px 6px;
  }

  .io-wrap{ display:none; }

  .links-editor{ display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
  .link-row{ display:flex; gap:6px; align-items:center; }
  .link-row .link-label{
    flex:0 0 84px;
    min-width:0;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--paper-card);
    outline:none;
  }
  .link-row .link-url{
    flex:1;
    min-width:0;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--paper-card);
    outline:none;
  }
  .link-row .link-label:focus, .link-row .link-url:focus{ border-color:var(--accent); }
  .link-row .link-remove{
    flex:0 0 auto;
    border:none;
    background:none;
    color:#B9AFA0;
    font-size:15px;
    cursor:pointer;
    padding:4px;
  }
  .link-row .link-remove:hover{ color:var(--accent); }
  .link-add{
    align-self:flex-start;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12px;
    color:var(--matcha);
    background:none;
    border:1px dashed var(--matcha);
    border-radius:4px;
    padding:5px 10px;
    cursor:pointer;
  }
  .link-limit-hint{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:11px;
    color:var(--ink-soft);
  }

  footer{
    text-align:center;
    padding:36px 20px 10px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:11px;
    color:#A6A091;
  }
</style>
</head>

<script>
const STORAGE_KEY = 'foodguide-data-v1';

    { jp:'おすすめは何ですか？', zh:'有推薦的餐點嗎？', src:'詢問店家推薦' },

// map old category keys (from an earlier version of this page) onto the new ones,
// so anyone reopening the page keeps whatever they had already added
const LEGACY_MERGE = {
  '麵類': '麵',
  '燒肉': '肉',
  '牛排': '肉',
  '咖啡': '飲品',
};

let data = null;

const TTS_SUPPORTED = 'speechSynthesis' in window;
const MAX_LINKS = 5;
const SPEAKER_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 9 8 9 13 4 13 20 8 15 3 15 3 9"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const EDIT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>';
const LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';

function copyText(text, el){
  const flash = ()=>{
    el.classList.add('copied');
    setTimeout(()=> el.classList.remove('copied'), 900);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(flash).catch(()=> fallbackCopy(text, flash));
  } else {
    fallbackCopy(text, flash);
  }
}

function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); }catch(e){ /* ignore */ }
  document.body.removeChild(ta);
  cb();
}

function speakJapanese(text, btn){
  if(!TTS_SUPPORTED) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  utter.rate = 0.9;
  if(btn){
    btn.classList.add('speaking');
    utter.onend = ()=> btn.classList.remove('speaking');
    utter.onerror = ()=> btn.classList.remove('speaking');
  }
  window.speechSynthesis.speak(utter);
}

// Works both inside Claude (window.storage) and when this file is hosted
// on its own (falls back to the browser's localStorage) so the page keeps
// remembering entries either way. If a cloud database URL has been set up
// (see setupCloudSync below), that takes priority so multiple devices stay
// in sync; local storage still acts as an offline cache either way.
const CLOUD_URL_KEY = 'foodguide-cloud-url';

function getCloudUrl(){
  try{ return localStorage.getItem(CLOUD_URL_KEY) || ''; }catch(e){ return ''; }
}
function setCloudUrl(url){
  try{ localStorage.setItem(CLOUD_URL_KEY, url); }catch(e){ /* ignore */ }
}

async function storageGet(key){
  const cloudUrl = getCloudUrl();
  if(cloudUrl){
    try{
      const res = await fetch(cloudUrl + '/' + key + '.json');
      if(res.ok){
        const val = await res.json();
        if(val !== null) return { value: JSON.stringify(val) };
        return null; // path exists but has no data yet
      }
    }catch(e){ /* offline or blocked — fall through to local cache */ }
  }
  if(window.storage && window.storage.get){
    try{ return await window.storage.get(key, false); }
    catch(e){ /* fall through to localStorage */ }
  }
  try{
    const raw = localStorage.getItem(key);
    return raw ? { value: raw } : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  const cloudUrl = getCloudUrl();
  if(cloudUrl){
    try{
      await fetch(cloudUrl + '/' + key + '.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: value,
      });
    }catch(e){ /* offline or blocked — local cache below still saves it */ }
  }
  if(window.storage && window.storage.set){
    try{ await window.storage.set(key, value, false); }
    catch(e){ /* fall through to localStorage */ }
  }
  try{ localStorage.setItem(key, value); }catch(e){ /* ignore */ }
}

async function loadData(){
  try{
    const res = await storageGet(STORAGE_KEY);
    if(res && res.value){
      const stored = JSON.parse(res.value);
      data = {};
      CATEGORY_META.forEach(c => { data[c.key] = stored[c.key] ? stored[c.key].slice() : []; });
      // pull in anything filed under an old category name
      let migrated = false;
      Object.keys(stored).forEach(oldKey=>{
        const target = LEGACY_MERGE[oldKey];
        if(target && Array.isArray(stored[oldKey]) && stored[oldKey].length){
          data[target] = data[target].concat(stored[oldKey]);
          migrated = true;
        }
      });
      if(migrated) await saveData();
      return;
    }
  }catch(e){ /* not found or storage unavailable */ }
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveData();
}

async function saveData(){
  await storageSet(STORAGE_KEY, JSON.stringify(data));
  const iso = new Date().toISOString();
  await storageSet(META_KEY, JSON.stringify(iso));
  showUpdatedAt(iso);
}

function showUpdatedAt(iso){
  const el = document.getElementById('updatedAt');
  if(!el) return;
  if(!iso){ el.textContent = ''; return; }
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  el.textContent = '更新於 ' + (d.getMonth()+1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function buildNav(){
  const nav = document.getElementById('navScroll');

function matches(item){
  if(!searchTerm) return true;
  const t = searchTerm.toLowerCase();
  return (item.jp && item.jp.toLowerCase().includes(t)) ||
         (item.zh && item.zh.toLowerCase().includes(t)) ||
         (item.src && item.src.toLowerCase().includes(t));
}

function render(){
  const container = document.getElementById('container');
  container.innerHTML = '';

  CATEGORY_META.forEach(c=>{
    const items = data[c.key] || [];
    const filtered = items.filter(matches);
    if(searchTerm && filtered.length === 0) return; // hide empty section while searching

    const section = document.createElement('section');
    section.className = 'category';
    section.id = 'sec-' + c.key;

    section.innerHTML = `
      <div class="cat-head">
        <div class="seal" style="--tilt:${c.tilt}">${c.seal}</div>
        <div class="cat-titles">
          <h2>${c.key}</h2>
          <div class="count">${items.length} 項</div>
        </div>
      </div>
      <div class="rule"></div>
    `;

    const cardsWrap = document.createElement('div');
    cardsWrap.className = 'cards';

    if(filtered.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '尚無項目，點下方新增第一筆吧';
      cardsWrap.appendChild(empty);
    } else {
      filtered.forEach(item=>{
        const realIndex = items.indexOf(item);
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.idx = realIndex;

        const srcFull = item.src || '';
        const srcShort = srcFull.length > 10 ? srcFull.slice(0, 10) + '…' : srcFull;
        const itemLinks = normalizeLinks(item.links).slice(0, MAX_LINKS);

        card.innerHTML = `
          <div class="ctrl-top">
            ${itemLinks.length ? `<button class="link-open" title="開啟連結">${LINK_ICON}</button>` : ''}
            <button class="edit" title="編輯">${EDIT_ICON}</button>
            <button class="del" title="刪除">×</button>
          </div>
          <div class="row1">
            ${searchTerm ? '' : '<span class="handle" title="拖曳排序">≡</span>'}
            ${TTS_SUPPORTED ? `<button class="speak" title="唸出日文">${SPEAKER_ICON}</button>` : ''}
            <span class="jp" title="點一下複製日文">${escapeHtml(item.jp)}</span>
          </div>
          <div class="row2">
            <span class="zh">${escapeHtml(item.zh)}</span>
            ${srcFull ? `<span class="src" title="長按看完整來源">${escapeHtml(srcShort)}</span>` : ''}
          </div>
        `;
        card.querySelector('.del').onclick = ()=> deleteItem(c.key, realIndex);
        card.querySelector('.edit').onclick = ()=> toggleEditForm(c.key, realIndex, card);
        const jpEl = card.querySelector('.jp');
        jpEl.addEventListener('click', ()=> copyText(item.jp, jpEl));
        const speakBtn = card.querySelector('.speak');
        if(speakBtn){
          speakBtn.addEventListener('click', ()=> speakJapanese(item.jp, speakBtn));
        }
        const linkBtn = card.querySelector('.link-open');
        if(linkBtn){
          linkBtn.addEventListener('click', (e)=>{
            e.stopPropagation();
            if(itemLinks.length === 1) openLink(itemLinks[0].url);
            else toggleLinkMenu(card, itemLinks);
          });
        }
        const srcEl = card.querySelector('.src');
        if(srcEl && srcFull.length > 10){
          const reveal = ()=>{ srcEl.textContent = srcFull; srcEl.classList.add('expanded'); };
          const hide = ()=>{ srcEl.textContent = srcShort; srcEl.classList.remove('expanded'); };
          srcEl.addEventListener('pointerdown', reveal);
          srcEl.addEventListener('pointerup', hide);
          srcEl.addEventListener('pointerleave', hide);
        }
        if(!searchTerm){
          card.querySelector('.handle').addEventListener('pointerdown', (e)=> startDrag(e, c.key, card, cardsWrap));
        }
        cardsWrap.appendChild(card);
      });
    }
    section.appendChild(cardsWrap);

    // add form
    const toggle = document.createElement('button');
    toggle.className = 'add-toggle';
    toggle.textContent = '＋ 新增項目到「' + c.key + '」';
    const form = document.createElement('div');
    form.className = 'add-form';
    form.innerHTML = `
      <div class="row">
        <input type="text" placeholder="日文名稱" class="f-jp">
        <input type="text" placeholder="中文名稱" class="f-zh">
      </div>
      <div class="row">
        <input type="text" placeholder="來源（選填，例如店名）" class="f-src">
      </div>
    `;
    const addLinksEditor = createLinksEditor([]);
    form.appendChild(addLinksEditor.element);
    const addActions = document.createElement('div');
    addActions.className = 'actions';
    addActions.innerHTML = `<button class="cancel">取消</button><button class="submit">加入清單</button>`;
    form.appendChild(addActions);

    toggle.onclick = ()=>{
      form.classList.toggle('open');
    };
    form.querySelector('.cancel').onclick = ()=> form.classList.remove('open');
    form.querySelector('.submit').onclick = ()=>{
      const jp = form.querySelector('.f-jp').value.trim();
      const zh = form.querySelector('.f-zh').value.trim();
      const src = form.querySelector('.f-src').value.trim();
      if(!jp && !zh){ form.querySelector('.f-jp').focus(); return; }
      addItem(c.key, jp, zh, src, addLinksEditor.getLinks());
    };
    section.appendChild(toggle);
    section.appendChild(form);

    container.appendChild(section);
  });

  updateActiveNav();
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function addItem(cat, jp, zh, src, links){
  data[cat].push({ jp, zh, src, links: (links||[]).slice(0, MAX_LINKS) });
  await saveData();
  render();
  document.getElementById('sec-'+cat).scrollIntoView({behavior:'smooth', block:'start'});
}

async function deleteItem(cat, index){
  const item = data[cat][index];
  const label = item ? (item.jp || item.zh || '這個項目') : '這個項目';
  if(!window.confirm('確定要刪除「' + label + '」嗎？')) return;
  data[cat].splice(index, 1);
  await saveData();
  render();
}

function normalizeLinks(links){
  return (links || []).map(l => typeof l === 'string' ? { label:'', url:l } : { label:l.label || '', url:l.url || '' });
}

function openLink(url){
  if(!url) return;
  window.open(/^https?:\/\//i.test(url) ? url : ('https://' + url), '_blank', 'noopener');
}

function toggleLinkMenu(card, links){
  const existing = card.querySelector('.link-menu');
  if(existing){ existing.remove(); return; }
  document.querySelectorAll('.link-menu').forEach(m => m.remove());

  const menu = document.createElement('div');
  menu.className = 'link-menu';
  links.forEach(l=>{
    const btn = document.createElement('button');
    btn.textContent = l.label || l.url;
    btn.title = l.url;
    btn.onclick = (e)=>{ e.stopPropagation(); openLink(l.url); menu.remove(); };
    menu.appendChild(btn);
  });
  card.appendChild(menu);

  setTimeout(()=>{
    document.addEventListener('click', function closeHandler(ev){
      if(!menu.contains(ev.target)){
        menu.remove();
        document.removeEventListener('click', closeHandler);
      }
    });
  }, 0);
}

function createLinksEditor(initialLinks){
  const wrap = document.createElement('div');
  wrap.className = 'links-editor';
  let linksArr = normalizeLinks(initialLinks).slice(0, MAX_LINKS);

  function renderRows(){
    wrap.innerHTML = '';
    linksArr.forEach((link, i)=>{
      const row = document.createElement('div');
      row.className = 'link-row';
      row.innerHTML = `<input type="text" class="link-label" placeholder="名稱（例如：地圖）">
        <input type="text" class="link-url" placeholder="貼上網址">
        <button type="button" class="link-remove" title="刪除連結">×</button>`;
      const labelInput = row.querySelector('.link-label');
      const urlInput = row.querySelector('.link-url');
      labelInput.value = link.label;
      urlInput.value = link.url;
      labelInput.addEventListener('input', ()=>{ linksArr[i].label = labelInput.value; });
      urlInput.addEventListener('input', ()=>{ linksArr[i].url = urlInput.value; });
      row.querySelector('.link-remove').addEventListener('click', ()=>{
        const hasContent = (linksArr[i].url || '').trim().length > 0 || (linksArr[i].label || '').trim().length > 0;
        if(hasContent && !window.confirm('確定要刪除這個連結嗎？')) return;
        linksArr.splice(i, 1);
        renderRows();
      });
      wrap.appendChild(row);
    });
    if(linksArr.length < MAX_LINKS){
      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'link-add';
      addBtn.textContent = '🔗 新增連結';
      addBtn.onclick = ()=>{ linksArr.push({ label:'', url:'' }); renderRows(); };
      wrap.appendChild(addBtn);
    } else {
      const hint = document.createElement('div');
      hint.className = 'link-limit-hint';
      hint.textContent = '最多可加 ' + MAX_LINKS + ' 個連結';
      wrap.appendChild(hint);
    }
  }
  renderRows();

  return {
    element: wrap,
    getLinks: ()=> linksArr
      .map(l => ({ label: (l.label || '').trim(), url: (l.url || '').trim() }))
      .filter(l => l.url)
      .slice(0, MAX_LINKS),
  };
}

function toggleEditForm(cat, index, card){
  const existing = card.nextElementSibling;
  if(existing && existing.classList.contains('edit-form')){
    existing.remove();
    return;
  }
  document.querySelectorAll('.edit-form').forEach(f => f.remove());

  const item = data[cat][index];
  const form = document.createElement('div');
  form.className = 'add-form open edit-form';
  form.innerHTML = `
    <div class="row">
      <input type="text" class="f-jp" placeholder="日文名稱">
      <input type="text" class="f-zh" placeholder="中文名稱">
    </div>
    <div class="row">
      <input type="text" class="f-src" placeholder="來源（選填）">
    </div>
  `;
  form.querySelector('.f-jp').value = item.jp || '';
  form.querySelector('.f-zh').value = item.zh || '';
  form.querySelector('.f-src').value = item.src || '';

  const linksEditor = createLinksEditor(item.links || []);
  form.appendChild(linksEditor.element);

  const actions = document.createElement('div');
  actions.className = 'actions';
  actions.innerHTML = `<button class="cancel">取消</button><button class="submit">儲存修改</button>`;
  form.appendChild(actions);

  form.querySelector('.cancel').onclick = ()=> form.remove();
  form.querySelector('.submit').onclick = async ()=>{
    const jp = form.querySelector('.f-jp').value.trim();
    const zh = form.querySelector('.f-zh').value.trim();
    const src = form.querySelector('.f-src').value.trim();
    if(!jp && !zh){ form.querySelector('.f-jp').focus(); return; }
    data[cat][index] = { jp, zh, src, links: linksEditor.getLinks() };
    await saveData();
    render();
  };

  card.insertAdjacentElement('afterend', form);
}

function startDrag(e, cat, card, wrap){
  e.preventDefault();
  const handle = e.currentTarget;
  try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  card.classList.add('dragging');

  function onMove(ev){
    const y = ev.clientY;
    const siblings = [...wrap.querySelectorAll('.card:not(.dragging)')];
    const after = siblings.find(sib=>{
      const box = sib.getBoundingClientRect();
      return y <= box.top + box.height / 2;
    });
    if(after) wrap.insertBefore(card, after);
    else wrap.appendChild(card);
  }

  function onUp(ev){
    card.classList.remove('dragging');
    try{ handle.releasePointerCapture(ev.pointerId); }catch(err){}
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    commitOrder(cat, wrap);
  }

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

async function commitOrder(cat, wrap){
  const items = data[cat];
  const newOrder = [...wrap.querySelectorAll('.card')].map(c => items[parseInt(c.dataset.idx, 10)]);
  data[cat] = newOrder;
  await saveData();
  render();
}

function computeActiveNav(){
  const pills = document.querySelectorAll('.navpill');
  const sections = CATEGORY_META
    .map(c => document.getElementById('sec-' + c.key))
    .filter(Boolean);
  if(sections.length === 0) return;

  const navbar = document.querySelector('.navbar');
  const line = navbar.offsetHeight + 24; // reference line just below the sticky nav

  let current = sections[0];
  for(const sec of sections){
    if(sec.getBoundingClientRect().top - line <= 0){
      current = sec;
    } else {
      break;
    }
  }
  const cat = current.id.replace('sec-', '');
  pills.forEach(p => p.classList.toggle('active', p.dataset.cat === cat));
}

let scrollListenerAttached = false;
function updateActiveNav(){
  if(!scrollListenerAttached){
    let ticking = false;
    window.addEventListener('scroll', ()=>{
      if(!ticking){
        requestAnimationFrame(()=>{ computeActiveNav(); ticking = false; });
        ticking = true;
      }
    }, { passive:true });
    scrollListenerAttached = true;
  }
  computeActiveNav();
}

  render();

/* ---------- CSV export / import (Excel-compatible) ---------- */

function csvField(v){
  const s = (v == null) ? '' : String(v);
  if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}

function exportCSV(){
  const rows = [['分類','日文','中文','來源','連結名稱','連結網址']];
  CATEGORY_META.forEach(c=>{
    (data[c.key] || []).forEach(item=>{
      const links = normalizeLinks(item.links);
      const namesStr = links.map(l => l.label).join(' | ');
      const urlsStr = links.map(l => l.url).join(' | ');
      rows.push([c.key, item.jp || '', item.zh || '', item.src || '', namesStr, urlsStr]);
    });
  });
  const csv = rows.map(r => r.map(csvField).join(',')).join('\r\n');
  // BOM so Excel opens it as UTF-8 and shows the Chinese/Japanese text correctly
  const blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '日本美食清單_' + todayStr() + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === ',' ){ row.push(field); field = ''; }
      else if(ch === '\r'){ /* skip */ }
      else if(ch === '\n'){ row.push(field); field=''; rows.push(row); row = []; }
      else field += ch;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length === 1 && r[0] === ''));
}

async function importCSV(text){
  let rows;
  try{ rows = parseCSV(text); }
  catch(e){ alert('讀取檔案時發生問題，請確認是從這個頁面匯出的 CSV 格式。'); return; }

  if(rows.length < 2){ alert('檔案內容看起來是空的。'); return; }

  const header = rows[0];
  const idx = {
    cat: header.indexOf('分類'),
    jp: header.indexOf('日文'),
    zh: header.indexOf('中文'),
    src: header.indexOf('來源'),
    linkNames: header.indexOf('連結名稱'),
    linkUrls: header.indexOf('連結網址'),
    linksOld: header.indexOf('連結'), // backward compatibility with the earlier combined-column export
  };
  if(idx.cat === -1 || idx.jp === -1 || idx.zh === -1){
    alert('欄位格式不符，請確認標題列有「分類」「日文」「中文」（「來源」「連結名稱」「連結網址」選填）。');
    return;
  }

  const newData = {};
  CATEGORY_META.forEach(c => { newData[c.key] = []; });
  let unknownCount = 0;

  for(let i = 1; i < rows.length; i++){
    const r = rows[i];
    if(!r || r.every(f => f === '')) continue;
    const cat = (r[idx.cat] || '').trim();
    const jp = (r[idx.jp] || '').trim();
    const zh = (r[idx.zh] || '').trim();
    const src = idx.src > -1 ? (r[idx.src] || '').trim() : '';

    let links = [];
    if(idx.linkUrls > -1){
      const names = idx.linkNames > -1 ? (r[idx.linkNames] || '').split('|').map(s => s.trim()) : [];
      const urls = (r[idx.linkUrls] || '').split('|').map(s => s.trim());
      const count = Math.max(names.length, urls.length);
      for(let k = 0; k < count && links.length < MAX_LINKS; k++){
        const url = urls[k] || '';
        if(!url) continue;
        links.push({ label: names[k] || '', url });
      }
    } else if(idx.linksOld > -1){
      links = (r[idx.linksOld] || '').split('|').map(s => s.trim()).filter(Boolean).slice(0, MAX_LINKS).map(piece=>{
        const sep = piece.indexOf('::');
        return sep > -1 ? { label: piece.slice(0, sep).trim(), url: piece.slice(sep+2).trim() } : { label:'', url: piece };
      });
    }
    if(!jp && !zh) continue;
    if(newData[cat]) newData[cat].push({ jp, zh, src, links });
    else { newData['其他'].push({ jp, zh, src, links }); unknownCount++; }
  }

  let msg = '確定要匯入嗎？這會覆蓋目前頁面上所有的項目資料。';
  if(unknownCount) msg += '\n有 ' + unknownCount + ' 筆分類名稱對不上，已自動歸類到「其他」。';
  if(!window.confirm(msg)) return;

  data = newData;
  await saveData();
  render();
  alert('匯入完成！');
}

document.getElementById('importBtn').addEventListener('click', ()=>{

document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  e.target.value = ''; // allow re-selecting the same file later

  const reader = new FileReader();
  reader.onload = (ev)=> importCSV(ev.target.result);
  reader.readAsText(file, 'UTF-8');
});

    await loadData();
    render();
    alert('雲端同步網址已設定，資料已同步。記得在其他裝置上也貼同一個網址，才會看到一樣的內容。');
  } else {
    alert('已取消雲端同步，改回只存在這台裝置。');
  }
});

(async function init(){
  buildNav();
  updateCloudBtnState();
  await loadData();
  render();
  try{
    const metaRes = await storageGet(META_KEY);
    showUpdatedAt(metaRes && metaRes.value ? JSON.parse(metaRes.value) : null);
  }catch(e){ /* ignore, just leave the label blank */ }
})();
</script>
